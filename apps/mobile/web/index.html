<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Landing at the airport? Find someone heading your way and split the cab.">
  <meta name="theme-color" content="#FBF3E7">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Airport Rides">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Airport Ride Matchmaking</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FBF3E7; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FBF3E7; color: #4A2545; z-index: 10;
      font-family: Georgia, "Times New Roman", serif; font-size: 22px;
      transition: opacity .3s ease;
    }
    #splash .road {
      width: 120px; height: 4px; border-radius: 2px;
      background: repeating-linear-gradient(90deg, #E8604B 0 14px, transparent 14px 24px);
      background-size: 48px 4px; animation: drive 0.9s linear infinite;
    }
    @keyframes drive { to { background-position: -48px 0; } }
    @media (prefers-reduced-motion: reduce) { #splash .road { animation: none; } }
  </style>

  <!-- Required by pusher_channels_flutter's web implementation -->
  <script charset="utf-8" src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" aria-hidden="true">
    <div>Airport Ride Matchmaking</div>
    <div class="road"></div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
