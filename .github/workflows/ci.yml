name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Next.js / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Builds the Android release bundle on every change so manifest, Gradle and
  # plugin problems show up here instead of on release day. Signing falls back
  # to the debug key when no upload keystore is configured (see android/app).
  android:
    name: Android release build
    runs-on: ubuntu-latest
    env:
      # Optional repository secrets for the real upload key (see
      # docs/ANDROID_RELEASE_SIGNING.md). Absent on forks and until you add them.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android lint in the current Gradle plugin needs JDK 21 (it calls
          # List.removeLast and crashes on 17). The app still compiles to 17.
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure release signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storeFile=../upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "SIGNING=upload" >> "$GITHUB_ENV"
          else
            # No real key available (pull requests from forks, secrets not set up
            # yet): sign with a throwaway key so the release signing path is
            # still exercised. This artifact is never published.
            keytool -genkeypair -keystore android/upload-keystore.jks -alias ci -storepass ci-password -keypass ci-password -dname "CN=CI Throwaway, O=CI" -keyalg RSA -keysize 2048 -validity 2
            {
              echo "storeFile=../upload-keystore.jks"
              echo "storePassword=ci-password"
              echo "keyAlias=ci"
              echo "keyPassword=ci-password"
            } > android/key.properties
            echo "SIGNING=throwaway" >> "$GITHUB_ENV"
          fi
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=https://airport-ride-matchmaking-api.vercel.app --dart-define=PUSHER_KEY=b7a8d59d5416afc1e718 --dart-define=PUSHER_CLUSTER=ap2
      - name: Bundle must not be debug-signed
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee /tmp/cert.txt
          if grep -q "Android Debug" /tmp/cert.txt; then
            echo "The release bundle is signed with the debug key" >&2
            exit 1
          fi
          if [ "$SIGNING" = "throwaway" ]; then grep -q "CI Throwaway" /tmp/cert.txt; fi
      - name: Upload signed bundle
        if: env.SIGNING == 'upload' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Release manifest must allow network and camera
        run: |
          manifest=$(find build/app/intermediates/merged_manifests -path '*elease*' -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          echo "Checking $manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"

  # The API project (airport-ride-matchmaking-api) auto-deploys via Vercel's
  # native GitHub integration -- no workflow step needed for it. The web
  # project can't use that path: Vercel's build image has no Flutter SDK, so
  # this job builds it here and uploads the static output directly.
  deploy-web:
    name: Deploy web app to Vercel
    runs-on: ubuntu-latest
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/mobile
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --dart-define=API_BASE_URL=https://airport-ride-matchmaking-api.vercel.app --dart-define=PUSHER_KEY=b7a8d59d5416afc1e718 --dart-define=PUSHER_CLUSTER=ap2
      - run: npx vercel deploy build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
